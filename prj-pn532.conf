# PN532 bring-up profile
CONFIG_ENV_NFC_PN532=y

# PN532 transport requirements
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=10
CONFIG_GPIO=y

# Logging — essential for bring-up on real hardware
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use RTT for console (SWD is the only bridged debug interface on this board).
# UART TX/RX on P1.08/P1.09 are defined in DTS but not wired to the debugger.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Keep probe logs enabled in isolated mode
CONFIG_NFC_TEST_OBSERVER=y

# Run I2C scanner once at boot to confirm bus/address visibility.
CONFIG_I2C_SCANNER_ON_BOOT=y

# Keep runs responsive while still filtering poll jitter.
CONFIG_PN532_DETECT_STREAK=2
CONFIG_PN532_REMOVE_STREAK=3

# Disable unrelated external interfaces for cleaner bring-up logs
CONFIG_BT=n
