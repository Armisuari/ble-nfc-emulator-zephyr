# ==============================================================================
# Full Application Profile — BLE + Zbus pipeline + PN532 NFC + RTT console
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System & Console Logging
# ------------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# RTT console (SWD is the only bridged debug interface on the DK).
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# ------------------------------------------------------------------------------
# 2. Zbus (Event Bus)
# ------------------------------------------------------------------------------
CONFIG_ZBUS=y
CONFIG_ZBUS_LOG_LEVEL_INF=y
# Required for ZBUS_CHAN_ADD_OBS (runtime observer registration).
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# ------------------------------------------------------------------------------
# 3. Bluetooth Low Energy (BLE)
# ------------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ble-nfc-emulator"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y

# ------------------------------------------------------------------------------
# 4. NFC (PN532 over I²C)
# ------------------------------------------------------------------------------
CONFIG_ENV_NFC_PN532=y
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=10
CONFIG_GPIO=y

# ------------------------------------------------------------------------------
# 5. C++ Support
# ------------------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP11=y
