# ==============================================================================
# Project Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System & Console Logging
# ------------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
# Enable floating-point formatting if math/logging needs it.
CONFIG_CBPRINTF_FP_SUPPORT=y

# ------------------------------------------------------------------------------
# 2. Zbus (Event Bus)
# ------------------------------------------------------------------------------
# Enables the decoupled message bus architecture.
CONFIG_ZBUS=y
CONFIG_ZBUS_LOG_LEVEL_INF=y

# ------------------------------------------------------------------------------
# 3. Bluetooth Low Energy (BLE)
# ------------------------------------------------------------------------------
CONFIG_BT=y
# Configure as a BLE Peripheral (Broadcaster/GATT Server)
CONFIG_BT_PERIPHERAL=y
# Set the device name that will appear in standard advertising packets
CONFIG_BT_DEVICE_NAME="ble-nfc-emulator"
# Set the maximum number of simultaneous connections (usually 1 for this use case)
CONFIG_BT_MAX_CONN=1
# Enable GATT dynamic database (needed for runtime service registration)
CONFIG_BT_GATT_DYNAMIC_DB=y

# ------------------------------------------------------------------------------
# 4. Hardware Simulation (DK specific)
# ------------------------------------------------------------------------------
# Enable GPIO to use the DK buttons to mock NFC tap events
CONFIG_GPIO=y

# ------------------------------------------------------------------------------
# 5. C++ Support
# ------------------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP11=y

# ------------------------------------------------------------------------------
# 6. Zbus Runtime Observers
# ------------------------------------------------------------------------------
# Required for ZBUS_CHAN_ADD_OBS (runtime observer registration)
CONFIG_ZBUS_RUNTIME_OBSERVERS=y